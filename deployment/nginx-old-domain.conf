server {
 listen 80;
 listen [::]:80;
 server_name ticket.cinematicaexpo.com;
 location /.well-known/acme-challenge/ { root /opt/ticketflow/acme; }
 location / { return 308 https://ticket.cinica.org$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 http2 on;
 server_name ticket.cinematicaexpo.com;
 ssl_certificate /etc/letsencrypt/live/ticket.cinematicaexpo.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ticket.cinematicaexpo.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log /www/wwwlogs/ticket.cinematicaexpo.com.redirect.log;
 return 308 https://ticket.cinica.org$request_uri;
}
