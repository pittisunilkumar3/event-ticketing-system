server {
 listen 80;
 listen [::]:80;
 server_name ticket.cinica.org;
 location /.well-known/acme-challenge/ { root /opt/ticketflow/acme; }
 location / { return 301 https://ticket.cinica.org$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 http2 on;
 server_name ticket.cinica.org;
 ssl_certificate /etc/letsencrypt/live/ticket.cinica.org/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ticket.cinica.org/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /opt/ticketflow/app/frontend/dist;
 index index.html;
 client_max_body_size 12m;
 access_log /www/wwwlogs/ticket.cinica.org.log;
 error_log /www/wwwlogs/ticket.cinica.org.error.log;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 location /api/ {
  proxy_pass http://127.0.0.1:5017;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
 }
 location /uploads/ {
  proxy_pass http://127.0.0.1:5017;
  proxy_set_header Host $host;
  add_header X-Content-Type-Options nosniff always;
 }
 location ~ ^/assets/.*\.mjs$ { types { application/javascript mjs; } try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
